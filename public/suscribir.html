<input id="token" placeholder="Pega tu System User Token" style="width:500px"><br><br>
<button onclick="sub()">Suscribir mi App a WABA 1164718859560441</button>
<pre id="log"></pre>
<script>
async function sub(){
  const token = document.getElementById('token').value;
  const r = await fetch(`https://graph.facebook.com/v20.0/1597597978810935/subscribed_apps`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({access_token: token})
  });
  const d = await r.json();
  document.getElementById('log').textContent = JSON.stringify(d,null,2);
}
</script>
