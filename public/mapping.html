<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Agregar Mapeo WABA</title>
<style>body{font-family:system-ui;padding:20px;max-width:600px;margin:auto}input{width:100%;padding:8px;margin:5px 0}button{padding:10px}</style>
</head><body>
<h2>Agregar WABA -> Seller URL</h2>
<input id="waba" placeholder="WABA ID o Messaging ID (ej: 1164718859560441)">
<input id="url" placeholder="URL Seller (ej: https://panel.sellerchat.ai/api/whatsapp/webhook/....)">
<button onclick="save()">Guardar</button>
<div id="res"></div>
<script>
async function save(){
  const waba_id = document.getElementById('waba').value.trim();
  const url_seller = document.getElementById('url').value.trim();
  const r = await fetch('/api/mapping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({waba_id, url_seller})});
  const j = await r.json();
  document.getElementById('res').innerText = JSON.stringify(j);
}
</script>
</body></html>
