<button onclick="launchEmbedded()" style="padding:12px 20px; background:#1877F2; color:white; border:0; border-radius:6px;">
  Conectar WhatsApp
</button>

<script>
  window.fbAsyncInit = function() {
    FB.init({ appId: '811281598468466', autoLogAppEvents: true, xfbml: true, version: 'v20.0' });
  };

  function launchEmbedded() {
    const url_seller = document.getElementById('url_seller').value;
    localStorage.setItem('url_seller', url_seller);
    
    FB.login(function(response){
      console.log(response);
      if(response.authResponse){
        const code = response.authResponse.code;
        // Aquí ya tienes el code para cambiar por token
        fetch('/api/exchange', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ code, url_seller, waba_id: prompt('Pega WABA ID que te dio Meta:'), phone_number_id: prompt('Phone ID:') })
        }).then(r=>r.json()).then(d=>alert('Mapeado: '+JSON.stringify(d)));
      }
    }, {
      scope: 'business_management,whatsapp_business_management,whatsapp_business_messaging',
      response_type: 'code',
      override_default_response_type: true,
      extras: { feature: 'whatsapp_business_app_onboarding', setup: {} }
    });
  }
</script>
<script async defer src="https://connect.facebook.net/en_US/sdk.js"></script>
