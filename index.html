<!DOCTYPE html>
<html lang="es">
<head>
<【entity-meta¦canonical_name=Meta】 charset="utf-8">
<【entity-meta¦canonical_name=Meta】 name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar WhatsApp</title>
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px} .card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px #0001} input{width:100%;padding:12px;margin:10px 0} button{width:100%;padding:14px;background:#1877F2;color:#fff;border:0;border-radius:8px}</style>
</head>
<body>
<div class="card">
<input id="url_seller" placeholder="https://panel.sellerchat.ai/api/whatsapp/webhook/...">
<button onclick="launch()">Conectar con Facebook</button>
<div id="status">Esperando...</div>
</div>

<script>
const APP_ID='811281598468466';
window.fbAsyncInit=function(){FB.init({appId:APP_ID,autoLogAppEvents:true,xfbml:true,version:'v20.0'});};

// Escucha cuando 【entity-Meta¦canonical_name=Meta】 cierra la ventana con "Cierra esta pestaña"
window.addEventListener('message', (event) => {
  if (event.origin !== "https://www.facebook.com" && event.origin !== "https://web.facebook.com") return;
  try {
    const data = JSON.parse(event.data);
    if (data.type === 'WA_EMBEDDED_SIGNUP') {
      console.log('Datos de WABA:', data);
      const waba_id = data.data?.waba_id;
      const phone_id = data.data?.phone_number_id;
      const code = data.data?.code;
      const url_seller = document.getElementById('url_seller').value;
      
      document.getElementById('status').innerText = '¡Recibido! WABA:'+waba_id+' guardando...';
      
      fetch('/api/exchange', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ code, waba_id, phone_number_id: phone_id, url_seller })
      }).then(r=>r.json()).then(d=>{
        document.getElementById('status').innerText = '✅ LISTO\nWABA: '+d.waba_id+'\nPhone: '+d.phone_id+'\nDestino: '+d.url_seller;
      });
    }
  } catch(e){}
});

function launch(){
  const url_seller=document.getElementById('url_seller').value.trim();
  if(!url_seller){alert('Pega URL Seller');return;}
  FB.login(function(r){}, {
    config_id: null,
    response_type: 'code',
    override_default_response_type: true,
    scope: 'business_management,whatsapp_business_management,whatsapp_business_messaging',
    extras: { feature: 'whatsapp_business_app_onboarding', setup: {} }
  });
}
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
