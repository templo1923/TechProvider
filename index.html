<!DOCTYPE html>
<html lang="es">
<head>
<【entity-meta¦canonical_name=Meta】 charset="utf-8">
<【entity-meta¦canonical_name=Meta】 name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar WhatsApp a Seller Chat</title>
<style>
  body{font-family:sans-serif; max-width:600px; margin:40px auto; padding:20px; background:#f7f7f7}
  .card{background:white; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1)}
  input{width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box}
  button{width:100%; padding:14px; background:#1877F2; color:white; border:0; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold}
  #status{margin-top:20px; padding:12px; border-radius:8px; background:#eef; white-space:pre-wrap; word-break:break-all}
</style>
</head>
<body>
<div class="card">
  <h2>Conectar tu WhatsApp</h2>
  <p>Tu número está en tu portafolio, le das acceso a nuestra App.</p>
  
  <label><b>1. Pega la URL que te da Seller Chat</b></label>
  <input id="url_seller" placeholder="https://sellerchat.com/webhook/cliente_123">

  <label><b>2. Conecta tu WhatsApp</b></label>
  <button id="btn" onclick="launchEmbedded()">Conectar con 【entity-Facebook¦canonical_name=Facebook】</button>

  <div id="status">Esperando...</div>
</div>

<script>
  const APP_ID = '811281598468466';

  window.fbAsyncInit = function() {
    FB.init({ appId: APP_ID, autoLogAppEvents: true, xfbml: true, version: 'v20.0' });
  };

  function launchEmbedded() {
    const url_seller = document.getElementById('url_seller').value.trim();
    if (!url_seller) { alert('Pega primero la URL de Seller Chat'); return; }
    
    document.getElementById('status').innerText = 'Abriendo popup de 【entity-Meta¦canonical_name=Meta】...';

    FB.login(function(response) {
      if (response.authResponse) {
        const code = response.authResponse.code;
        document.getElementById('status').innerText = 'Permiso dado, buscando tu WABA...';

        fetch('/api/exchange', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ code, url_seller })
        })
        .then(r=>r.json())
        .then(data=>{
          if(data.error) throw new Error(JSON.stringify(data));
          document.getElementById('status').innerText = 
            '✅ LISTO!\n\n' +
            'Mapeo guardado:\n' +
            'WABA ID: ' + data.waba_id + '\n' +
            'Phone ID: ' + data.phone_id + '\n' +
            'Destino: ' + data.url_seller + '\n\n' +
            'Ahora ve a Seller Chat y pega:\n' +
            'WABA ID: ' + data.waba_id + '\n' +
            'Phone ID: ' + data.phone_id + '\n\n' +
            'Token para Seller Chat (guárdalo):\n' + data.access_token.substring(0,40) + '...\n\n' +
            'Luego ve a Business Manager > Cuentas de WhatsApp > Conversation routing y cambia a techproviderseller';
        })
        .catch(e=>{
          document.getElementById('status').innerText = 'Error: ' + e;
        });

      } else {
        document.getElementById('status').innerText = 'Cancelaste el login';
      }
    }, {
      scope: 'business_management,whatsapp_business_management,whatsapp_business_messaging',
      response_type: 'code',
      override_default_response_type: true,
      extras: { feature: 'whatsapp_business_app_onboarding', setup: {} }
    });
  }
</script>
<script async defer crossorigin="anonymous" src="https://connect.【entity-facebook¦canonical_name=Facebook】.net/en_US/sdk.js"></script>
</body>
</html>
